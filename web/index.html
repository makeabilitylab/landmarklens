<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360° Street View</title>

    <!-- Pannellum 360 viewer -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <!-- Leaflet map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 360 Panorama Viewer (dual layers for crossfade) -->
        <div id="panorama-container">
            <div id="pano-layer-0" class="pano-layer active"></div>
            <div id="pano-layer-1" class="pano-layer"></div>

            <!-- Navigation overlay -->
            <div id="nav-overlay">
                <button id="btn-prev" class="nav-btn nav-prev" title="Previous (←)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <button id="btn-next" class="nav-btn nav-next" title="Next (→)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>

            <!-- Yaw HUD (live view direction) -->
            <div id="yaw-hud">
                <span id="yaw-display">Yaw: 0°</span>
            </div>

            <!-- Info bar -->
            <div id="info-bar">
                <div id="frame-info">
                    <span id="frame-counter">1 / 113</span>
                    <span id="heading-display">GPS: 0°</span>
                </div>
                <div id="controls">
                    <label class="control-group" title="Rotate the initial forward direction for all frames">
                        <span>Forward offset:</span>
                        <input type="range" id="yaw-offset" min="-180" max="180" value="0" step="1">
                        <span id="yaw-offset-val">0°</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Map Panel -->
        <div id="map-panel">
            <div id="map-header">
                <h3>Route Map</h3>
                <button id="btn-toggle-map" class="icon-btn" title="Toggle map size">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <polyline points="9 21 3 21 3 15"></polyline>
                        <line x1="21" y1="3" x2="14" y2="10"></line>
                        <line x1="3" y1="21" x2="10" y2="14"></line>
                    </svg>
                </button>
            </div>
            <div id="map"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
